<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #00ff41;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

body {
    padding: 18px;
    box-sizing: border-box;
    font-size: 15px;
}

#terminal {
    white-space: pre-wrap;
    line-height: 1.45;
}

.cursor {
    display: inline-block;
    width: 8px;
    height: 17px;
    background: #00ff41;
    vertical-align: -3px;
    animation: blink .7s infinite;
}

#hackScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#hackScreen h1 {
    margin: 0;
    color: #ff2020;
    font-family: Arial, sans-serif;
    font-size: clamp(55px, 13vw, 180px);
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow:
        0 0 10px #ff2020,
        0 0 30px #ff2020,
        0 0 70px #ff2020;
    animation: glitch .12s infinite;
}

#hackScreen p {
    color: white;
    font-size: 22px;
    margin-top: 25px;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

@keyframes glitch {
    0% {
        transform: translate(0);
    }

    25% {
        transform: translate(5px, -3px);
    }

    50% {
        transform: translate(-5px, 3px);
    }

    75% {
        transform: translate(3px, 1px);
    }

    100% {
        transform: translate(0);
    }
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="hackScreen">
    <h1>YOU'RE HACKED</h1>
    <p>Hacked By Kyan</p>
</div>

<audio id="hackSound" src="hacked.mp3" preload="auto"></audio>

<script>

const terminal = document.getElementById("terminal");
const hackScreen = document.getElementById("hackScreen");
const sound = document.getElementById("hackSound");

const lines = [
    "C:\\Users\\User> initialize.exe",
    "",
    "Initializing system...",
    "Loading security modules...",
    "Establishing secure connection...",
    "Connection established.",
    "",
    "C:\\Users\\User> scan --network",
    "Scanning network interface...",
    "Interface detected.",
    "Analyzing connection...",
    "Connection verified.",
    "",
    "C:\\Users\\User> security --check",
    "Checking security status...",
    "Firewall detected.",
    "Analyzing protection layers...",
    "Processing...",
    "",
    "C:\\Users\\User> access --root",
    "Authenticating...",
    "Authentication accepted.",
    "Access level: ROOT",
    "",
    "C:\\Users\\User> scan --system",
    "Scanning system...",
    "Loading system data...",
    "Analyzing files...",
    "Processing encrypted data...",
    "Decrypting...",
    "Complete.",
    "",
    "C:\\Users\\User> execute",
    "Executing...",
    "████████████████████████████████ 100%",
    "",
    "Access granted.",
    "Connection secured."
];

let line = 0;
let character = 0;

function type() {

    if (line >= lines.length) {
        finish();
        return;
    }

    const text = lines[line];

    if (character < text.length) {

        terminal.textContent += text[character];

        character++;

        setTimeout(type, 12);

    } else {

        terminal.textContent += "\n";

        line++;
        character = 0;

        setTimeout(type, 180);
    }
}

function finish() {

    hackScreen.style.display = "flex";

    sound.currentTime = 0;

    sound.play().catch(() => {
        console.log("Browser blokkeerde automatisch geluid.");
    });
}

type();

</script>

</body>
</html>
